[package]
name = "cyward"
version = "0.1.0"
edition = "2024"
description = "Agent de détection d'intrusions réseau et logs, avec triage par un LLM cyber open source"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
etherparse = "0.21"
futures = "0.3"
ipnet = { version = "2", features = ["serde"] }
parking_lot = "0.12"
pcap-file = "2"
pnet_datalink = "0.35"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
