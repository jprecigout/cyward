<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyward</title>
<!-- Icône d'onglet : assets/favicon.svg encodé en ligne, pour que la page reste autonome (aucune autre requête). -->
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"%3E%3Cpath d="M128 16 L216 48 V120 C216 177 178 219 128 240 C78 219 40 177 40 120 V48 Z" fill="%230d1117" stroke="%2358a6ff" stroke-width="18" stroke-linejoin="round"/%3E%3Cpath d="M52 140 H92 L112 178 L134 72 L156 160 L166 140 H204" fill="none" stroke="%233fb950" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/%3E%3C/svg%3E'>
<style>
  /* Palette (thème sombre). Chaque sévérité a sa couleur, reprise dans les cartes via la variable --c. */
  :root {
    --bg: #0d1117; --panel: #161b22; --panel-2: #1c2330; --border: #2a3240;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --info: #6e7681; --low: #3fb950; --medium: #d29922; --high: #f0883e; --critical: #f85149;
    --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* Bandeau fixe en haut de page : nom, indicateur de connexion et pastilles de statistiques. */
  header { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; z-index: 2; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 17px; letter-spacing: .3px; display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--low); box-shadow: 0 0 8px var(--low); }
  .brand .dot.off { background: var(--critical); box-shadow: 0 0 8px var(--critical); }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .pill { background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .pill b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .pill.ok b { color: var(--low); } .pill.ko b { color: var(--critical); }
  main { max-width: 1200px; margin: 0 auto; padding: 20px; }
  /* Compteurs par sévérité, cliquables pour filtrer la liste. */
  .counters { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 18px; }
  .counter { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; cursor: pointer; border-top: 3px solid var(--c); transition: background .15s; }
  .counter:hover { background: var(--panel-2); }
  .counter.active { outline: 2px solid var(--c); }
  .counter .n { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .counter .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar input, .toolbar select { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font: inherit; }
  .toolbar input { flex: 1; min-width: 200px; }
  /* Liste des alertes. Une carte = une ligne résumée (.row) + un détail dépliable (.details). */
  .alerts { display: flex; flex-direction: column; gap: 8px; }
  .alert { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--c); border-radius: 8px; overflow: hidden; }
  /* Bref clignotement d'une alerte qui vient d'arriver. */
  .alert.fresh { animation: flash 1.6s ease-out; }
  @keyframes flash { from { background: color-mix(in srgb, var(--c) 30%, var(--panel)); } to { background: var(--panel); } }
  .row { display: grid; grid-template-columns: 92px 1fr auto auto; gap: 12px; align-items: center; padding: 10px 14px; cursor: pointer; }
  .row:hover { background: var(--panel-2); }
  .sev { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--c); }
  .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 12px; }
  .time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  /* Badge d'état du triage IA ; la classe ajoutée est le verdict renvoyé par le modèle. */
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .badge.malveillant { color: var(--critical); border-color: var(--critical); }
  .badge.suspect { color: var(--medium); border-color: var(--medium); }
  .badge.bénin, .badge.benin { color: var(--low); border-color: var(--low); }
  .badge.pending { color: var(--accent); border-color: var(--accent); }
  .badge.pending::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 5px; animation: pulse 1s infinite alternate; vertical-align: middle; }
  @keyframes pulse { to { opacity: .2; } }
  /* Détail d'une alerte : masqué tant que la carte n'a pas la classe .open. */
  .details { display: none; border-top: 1px solid var(--border); padding: 14px; gap: 14px; grid-template-columns: 1fr 1fr; }
  .alert.open .details { display: grid; }
  .details h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .details p { margin: 0 0 10px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 13px; margin-bottom: 10px; }
  .kv span:nth-child(odd) { color: var(--muted); }
  .kv span:nth-child(even) { font-family: var(--mono); word-break: break-all; }
  pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin: 0; font: 12px/1.4 var(--mono); overflow: auto; max-height: 260px; white-space: pre-wrap; word-break: break-all; }
  /* Encadré de l'analyse IA : jauge de confiance, liens MITRE, recommandations. */
  .ai { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .conf { height: 6px; border-radius: 3px; background: var(--border); margin: 6px 0 12px; overflow: hidden; }
  .conf > div { height: 100%; background: var(--accent); }
  .ai ul, .ai ol { margin: 4px 0 10px; padding-left: 20px; }
  .mitre a { color: var(--accent); font-family: var(--mono); font-size: 12px; margin-right: 8px; text-decoration: none; }
  .mitre a:hover { text-decoration: underline; }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; border: 1px dashed var(--border); border-radius: 10px; }
  /* Apprentissage du comportement normal : panneau d'état, diff à valider, question « est-ce normal ? ». */
  .baseline { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 18px; }
  .baseline h3 { margin: 0 0 8px; font-size: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .baseline p { margin: 4px 0; }
  .line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .btn { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .btn.ok { border-color: var(--low); color: var(--low); }
  .btn.danger { border-color: var(--critical); color: var(--critical); }
  select.inp { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font: inherit; font-size: 13px; }
  .candidate { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
  .host-diff { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin: 8px 0; background: var(--panel-2); }
  .host-diff.drift { border-color: var(--high); }
  .host-diff.chosen-accept { border-left: 4px solid var(--low); }
  .host-diff.chosen-reject { border-left: 4px solid var(--critical); }
  .changes { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
  .changes td, .changes th { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--border); }
  .changes th { color: var(--muted); font-weight: 500; }
  .warn { color: var(--high); font-weight: 600; }
  .ask { margin-top: 12px; padding: 10px 12px; border: 1px dashed var(--accent); border-radius: 8px; }
  .msg { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .msg.err { color: var(--critical); }
  /* Petits écrans : compteurs sur deux lignes, détail en une colonne. */
  @media (max-width: 760px) {
    .counters { grid-template-columns: repeat(3, 1fr); }
    .row { grid-template-columns: 70px 1fr; }
    .row .time, .row .badge { grid-column: 2; justify-self: start; }
    .details { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<!-- Page unique, sans dépendance externe, servie par web.rs et embarquée dans le binaire. -->
<!-- Le point #live passe au rouge si la connexion SSE est perdue ; #pills est rempli par refreshStats(). -->
<header>
  <div class="brand">
    <!-- Logo (variante simplifiée de assets/favicon.svg, lisible en petit). -->
    <svg viewBox="0 0 256 256" width="26" height="26" aria-hidden="true"><path d="M128 16 L216 48 V120 C216 177 178 219 128 240 C78 219 40 177 40 120 V48 Z" fill="#0d1117" stroke="#58a6ff" stroke-width="18" stroke-linejoin="round"/><path d="M52 140 H92 L112 178 L134 72 L156 160 L166 140 H204" fill="none" stroke="#3fb950" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Cyward<span class="dot" id="live"></span>
  </div>
  <div class="pills" id="pills"></div>
</header>
<main>
  <!-- Rempli par renderCounters(). -->
  <div class="counters" id="counters"></div>
  <!-- Filtres : chaque modification relance renderAll(). -->
  <div class="toolbar">
    <input id="search" type="search" placeholder="Filtrer par IP, titre, type…">
    <select id="source">
      <option value="">Toutes les sources</option>
      <option value="network">Réseau</option>
      <option value="logs">Logs système</option>
    </select>
    <select id="verdict">
      <option value="">Tous les verdicts</option>
      <option value="malveillant">Malveillant</option>
      <option value="suspect">Suspect</option>
      <option value="bénin">Bénin</option>
      <option value="pending">Analyse en cours</option>
    </select>
  </div>
  <!-- Apprentissage du comportement normal : rempli par renderBaseline(), masqué s'il est désactivé. -->
  <section class="baseline" id="baseline" hidden></section>
  <!-- Remplie par renderAll(), puis mise à jour carte par carte par upsert(). -->
  <div class="alerts" id="alerts"></div>
</main>
<script>
// Fonctionnement : au chargement, la page ouvre un flux SSE (/api/events). À chaque (re)connexion,
// elle recharge la liste complète (/api/alerts), puis applique les événements « new » / « update »
// au fil de l'eau. Les statistiques du bandeau sont relues toutes les 2 s (/api/stats).

// Sévérités dans l'ordre d'affichage des compteurs, et leurs libellés.
const SEVERITIES = ["critical", "high", "medium", "low", "info"];
const LABELS = { critical: "Critique", high: "Haute", medium: "Moyenne", low: "Basse", info: "Info" };
// Jeton éventuel passé dans l'URL de la page (?token=…), réutilisé pour tous les appels à l'API.
const token = new URLSearchParams(location.search).get("token");
// Ajoute le jeton à un chemin d'API s'il y en a un.
const q = (path) => token ? `${path}${path.includes("?") ? "&" : "?"}token=${encodeURIComponent(token)}` : path;
// Les actions (répondre, valider) exigent le jeton côté serveur ; sans lui, les boutons sont désactivés.
const canWrite = !!token;

// Requête d'écriture : le jeton passe dans l'en-tête Authorization (le serveur refuse le jeton d'URL
// pour les écritures, contre les requêtes forgées par une page tierce). Lève une erreur lisible.
async function post(path, body) {
  const r = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", ...(token ? { Authorization: `Bearer ${token}` } : {}) },
    body: JSON.stringify(body ?? {}),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `erreur ${r.status}`);
  return data;
}

// État de la page : alertes par identifiant, cartes dépliées, filtre de sévérité actif.
const alerts = new Map();
const open = new Set();
let minSeverity = null;
// Mesure précédente, pour calculer le débit en paquets par seconde.
let lastPackets = null, lastTime = null;

// Construit le DOM sans innerHTML : les champs viennent du réseau et des logs, donc d'un attaquant potentiel.
// el("div", { class: "x", onclick: f }, enfant1, [enfant2, enfant3]) : les attributs « on… » deviennent
// des écouteurs d'événements, les enfants texte sont insérés comme texte (jamais interprétés en HTML),
// les tableaux sont aplatis et null est ignoré (pratique pour les éléments conditionnels).
function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null) e.append(c instanceof Node ? c : String(c));
  return e;
}

// Formatage des dates, nombres et tailles à la française.
const fmtTime = (s) => new Date(s).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
const fmtNum = (n) => n.toLocaleString("fr-FR");
const fmtBytes = (b) => { const u = ["o", "Ko", "Mo", "Go", "To"]; let i = 0; while (b >= 1024 && i < 4) { b /= 1024; i++; } return `${b.toFixed(1)} ${u[i]}`; };
const sevColor = (s) => `var(--${s})`;

// Badge de la ligne d'alerte : état du triage IA, verdict, ou à défaut l'origine de l'alerte.
function verdictBadge(a) {
  if (a.triage === "pending") return el("span", { class: "badge pending" }, "IA en attente");
  if (a.triage === "failed") return el("span", { class: "badge" }, "IA en échec");
  if (a.analysis) return el("span", { class: `badge ${a.analysis.verdict}` }, `${a.analysis.verdict} · ${Math.round(a.analysis.confidence * 100)} %`);
  return el("span", { class: "badge" }, a.source === "network" ? "réseau" : "logs");
}

// Colonne droite du détail : l'analyse du modèle, ou un message expliquant son absence.
function renderAnalysis(a) {
  if (!a.analysis) {
    const msg = a.triage === "pending" ? "En attente du modèle (analyses traitées une par une, ou modèle hors ligne)…"
      : a.triage === "failed" ? "L'analyse a échoué (voir les logs de l'agent)."
      : "Non envoyée au modèle (sévérité inférieure au seuil).";
    return el("div", { class: "ai" }, el("h4", {}, "Analyse IA"), el("p", { class: "meta" }, msg));
  }
  const an = a.analysis;
  return el("div", { class: "ai" },
    el("h4", {}, `Analyse IA · ${an.model.split("/").pop()}`),
    el("div", {}, verdictBadge(a)),
    el("div", { class: "conf" }, el("div", { style: `width:${Math.round(an.confidence * 100)}%` })),
    el("p", {}, an.summary),
    an.mitre.length ? el("div", { class: "mitre" }, el("h4", {}, "MITRE ATT&CK"),
      an.mitre.map(t => {
        // Lien vers la fiche ATT&CK si un identifiant Txxxx(.yyy) est reconnu ; T1110.001 → /techniques/T1110/001/.
        const id = (t.match(/T\d{4}(?:\.\d{3})?/) || [])[0];
        return id ? el("a", { href: `https://attack.mitre.org/techniques/${id.replace(".", "/")}/`, target: "_blank", rel: "noopener" }, t) : el("span", { class: "meta" }, t + " ");
      })) : null,
    an.recommendations.length ? [el("h4", { style: "margin-top:10px" }, "Recommandations"), el("ol", {}, an.recommendations.map(r => el("li", {}, r)))] : null,
  );
}

// Carte d'une alerte : ligne cliquable (sévérité, titre, résumé, badge, heure) et détail dépliable.
// `fresh` active l'animation de nouvelle alerte. L'état déplié est conservé dans `open`, pour
// survivre au remplacement de la carte lors d'une mise à jour.
function renderAlert(a, fresh = false) {
  const card = el("div", { class: `alert${open.has(a.id) ? " open" : ""}${fresh ? " fresh" : ""}`, style: `--c:${sevColor(a.severity)}`, "data-id": a.id },
    el("div", { class: "row", onclick: () => { open.has(a.id) ? open.delete(a.id) : open.add(a.id); card.classList.toggle("open"); } },
      el("div", { class: "sev" }, LABELS[a.severity]),
      el("div", { style: "min-width:0" },
        el("div", { class: "title" }, a.title),
        el("div", { class: "meta" }, [a.kind.replaceAll("_", " "), a.src && `src ${a.src}`, a.dst && `→ ${a.dst}`, a.count > 1 && `×${a.count}`].filter(Boolean).join(" · "))),
      verdictBadge(a),
      el("div", { class: "time" }, fmtTime(a.last_seen))),
    el("div", { class: "details" },
      el("div", {},
        el("h4", {}, "Détection"),
        el("p", {}, a.description || "—"),
        el("div", { class: "kv" },
          el("span", {}, "Source"), el("span", {}, a.src || "—"),
          el("span", {}, "Cible"), el("span", {}, a.dst || "—"),
          el("span", {}, "Première vue"), el("span", {}, fmtTime(a.first_seen)),
          el("span", {}, "Dernière vue"), el("span", {}, fmtTime(a.last_seen)),
          el("span", {}, "Occurrences"), el("span", {}, a.count)),
        el("h4", {}, "Preuves"),
        el("pre", {}, JSON.stringify(a.evidence, null, 2))),
      el("div", {}, renderAnalysis(a), a.kind === "host_anomaly" ? renderFeedback(a) : null)));
  return card;
}

// Vrai si l'alerte passe tous les filtres actifs (sévérité, source, verdict, recherche texte).
function matches(a) {
  if (minSeverity && a.severity !== minSeverity) return false;
  const src = document.getElementById("source").value;
  if (src && a.source !== src) return false;
  const v = document.getElementById("verdict").value;
  if (v === "pending" && a.triage !== "pending") return false;
  if (v && v !== "pending" && a.analysis?.verdict !== v) return false;
  const s = document.getElementById("search").value.trim().toLowerCase();
  if (s && ![a.title, a.kind, a.src, a.dst, a.description].some(x => x && x.toLowerCase().includes(s))) return false;
  return true;
}

// Reconstruit toute la liste (après un changement de filtre ou un rechargement complet).
function renderAll() {
  const list = document.getElementById("alerts");
  const items = [...alerts.values()].filter(matches).sort((x, y) => y.id - x.id);
  list.replaceChildren(...(items.length ? items.map(a => renderAlert(a)) :
    [el("div", { class: "empty" }, alerts.size ? "Aucune alerte ne correspond aux filtres." : "Aucune alerte pour l'instant. L'agent surveille le réseau et les logs.")]));
  renderCounters();
}

// Applique un événement du flux : remplace la carte existante, ou insère la nouvelle en tête.
// Plus léger que renderAll(), et préserve la position de lecture dans la liste.
function upsert(a, isNew) {
  alerts.set(a.id, a);
  if (!matches(a)) return renderCounters();
  const list = document.getElementById("alerts");
  const existing = list.querySelector(`[data-id="${a.id}"]`);
  const card = renderAlert(a, isNew);
  if (existing) existing.replaceWith(card);
  else { list.querySelector(".empty")?.remove(); list.prepend(card); }
  renderCounters();
}

// Compteurs par sévérité (sur toutes les alertes, filtres ignorés). Un clic filtre ou défiltre.
function renderCounters() {
  const counts = Object.fromEntries(SEVERITIES.map(s => [s, 0]));
  for (const a of alerts.values()) counts[a.severity]++;
  document.getElementById("counters").replaceChildren(...SEVERITIES.map(s =>
    el("div", { class: `counter${minSeverity === s ? " active" : ""}`, style: `--c:${sevColor(s)}`, onclick: () => { minSeverity = minSeverity === s ? null : s; renderAll(); } },
      el("div", { class: "n" }, fmtNum(counts[s])), el("div", { class: "l" }, LABELS[s]))));
}

// Met à jour les pastilles du bandeau. Le débit est calculé côté navigateur, par différence
// avec la mesure précédente.
async function refreshStats() {
  try {
    const { stats } = await (await fetch(q("/api/stats"))).json();
    const now = Date.now();
    const pps = lastPackets != null ? Math.max(0, (stats.packets - lastPackets) / ((now - lastTime) / 1000)) : 0;
    lastPackets = stats.packets; lastTime = now;
    const pill = (label, value, cls = "") => el("span", { class: `pill ${cls}` }, `${label} `, el("b", {}, value));
    document.getElementById("pills").replaceChildren(...[
      pill("Interface", stats.interface || "—"),
      pill("Paquets", `${fmtNum(stats.packets)} (${fmtNum(Math.round(pps))}/s)`),
      pill("Trafic", fmtBytes(stats.bytes)),
      stats.dropped ? pill("Perdus", fmtNum(stats.dropped), "ko") : null,
      pill("Lignes de logs", fmtNum(stats.log_lines)),
      pill("IA", stats.llm_online ? `en ligne · ${stats.llm_analyzed} analysées` : "hors ligne", stats.llm_online ? "ok" : "ko"),
    ].filter(Boolean));
  } catch { /* l'indicateur de connexion suffit */ }
}

// Connexion au flux d'événements. EventSource se reconnecte tout seul après une coupure ;
// `onopen` recharge alors la liste complète pour rattraper les événements manqués.
function connect() {
  const es = new EventSource(q("/api/events"));
  const dot = document.getElementById("live");
  es.onopen = async () => {
    dot.classList.remove("off");
    const list = await (await fetch(q("/api/alerts?limit=1000"))).json();
    alerts.clear();
    for (const a of list) alerts.set(a.id, a);
    renderAll();
  };
  es.onmessage = (m) => { const ev = JSON.parse(m.data); upsert(ev.alert, ev.type === "new"); };
  es.onerror = () => dot.classList.add("off");
}

// ---------------------------------------------------------------------------------------------
// Apprentissage du comportement normal (voir doc/conception-normalite.md)
// ---------------------------------------------------------------------------------------------

// Motifs proposés à la question « est-ce normal ? ».
const REASONS = ["Mise à jour d'un jeu ou d'un logiciel", "Mise à jour du système", "Sauvegarde", "Nouvel appareil", "Nouvel usage", "Autre"];
const NO_TOKEN = "Pour répondre, ouvrez le dashboard avec ?token=… (web.token doit être défini dans la configuration).";

// Bloc « est-ce normal ? » d'une anomalie, ou la réponse déjà donnée.
function renderFeedback(a) {
  if (a.feedback) {
    const f = a.feedback;
    return el("div", { class: "ask" },
      el("h4", {}, "Votre réponse"),
      el("p", {}, `${f.verdict === "normal" ? "Normal" : "Suspect"}${f.reason ? ` · ${f.reason}` : ""}${f.verdict === "normal" ? (f.scope === "always" ? " · désormais pour cette machine" : " · cette fois seulement") : ""}`),
      el("p", { class: "meta" }, fmtTime(f.at)));
  }
  const reason = el("select", { class: "inp" }, REASONS.map(r => el("option", {}, r)));
  const scope = el("select", { class: "inp" },
    el("option", { value: "once" }, "Cette fois seulement"),
    el("option", { value: "always" }, "Désormais pour cette machine et ce type d'écart"));
  const msg = el("div", { class: "msg" }, canWrite ? "Le modèle n'apprendra cette période que si vous la confirmez normale." : NO_TOKEN);
  const send = async (verdict) => {
    msg.className = "msg"; msg.textContent = "Envoi…";
    try {
      // Le motif et la portée ne concernent que la réponse « normal ».
      const r = await post(`/api/alerts/${a.id}/feedback`, verdict === "normal" ? { verdict, reason: reason.value, scope: scope.value } : { verdict, scope: "once" });
      msg.textContent = `${r.updated_windows} fenêtre(s) mise(s) à jour.`;
      refreshBaseline();
    } catch (e) { msg.className = "msg err"; msg.textContent = e.message; }
  };
  const disabled = canWrite ? {} : { disabled: "" };
  return el("div", { class: "ask" },
    el("h4", {}, "Est-ce normal ?"),
    el("div", { class: "line" }, reason, scope),
    el("div", { class: "line" },
      el("button", { class: "btn ok", onclick: () => send("normal"), ...disabled }, "C'est normal"),
      el("button", { class: "btn danger", onclick: () => send("suspect"), ...disabled }, "C'est suspect")),
    msg);
}

// Choix accepter/refuser par machine du diff, conservés entre deux rafraîchissements du panneau.
const choices = {};
let lastBaseline = "";
let baselineMsg = { text: "", err: false };

// Panneau d'état : modèle actif ou progression de l'apprentissage, actions, diff à valider.
function renderBaseline(b) {
  const box = document.getElementById("baseline");
  box.hidden = !b.enabled;
  if (!b.enabled) return;
  const s = b.samples, L = b.learning;
  const usable = s.normal + s.confirmed_normal;
  const act = async (label, fn) => {
    baselineMsg = { text: `${label}…`, err: false }; lastBaseline = ""; refreshBaseline();
    try { baselineMsg = { text: await fn(), err: false }; } catch (e) { baselineMsg = { text: e.message, err: true }; }
    lastBaseline = ""; refreshBaseline();
  };
  const disabled = canWrite ? {} : { disabled: "" };

  const status = b.active
    ? el("p", {}, `Modèle actif v${b.active.version} · appris le ${fmtTime(b.active.trained_at)} · ${fmtNum(b.active.samples)} fenêtres, ${b.active.hosts} machine(s) · seuil ${b.active.threshold.toFixed(2)}`)
    : el("p", {}, `Aucun modèle validé : apprentissage en cours (${L.covered_hours.toFixed(1)} h observées sur ${L.required_hours} h, ${fmtNum(usable)} fenêtres utilisables sur ${fmtNum(L.required_samples)}).`);

  const versions = b.versions.filter(v => !b.active || v !== b.active.version);
  const versionSel = el("select", { class: "inp" }, versions.map(v => el("option", { value: v }, `v${v}`)));

  // replaceChildren afficherait « null » pour les blocs absents : on les retire d'abord.
  box.replaceChildren(...[
    el("h3", {}, "Comportement normal",
      el("span", { class: "badge" }, b.mode === "observation" ? "mode observation" : "mode alerte"),
      b.persistent ? null : el("span", { class: "badge pending" }, "en mémoire : perdu au redémarrage")),
    status,
    el("p", { class: "meta" }, `Fenêtres de ${b.window_secs} s : ${fmtNum(s.normal)} normales, ${fmtNum(s.flagged)} en attente de réponse, ${fmtNum(s.confirmed_normal)} confirmées normales, ${fmtNum(s.suspicious)} suspectes (jamais apprises).`),
    el("div", { class: "line" },
      el("button", { class: "btn primary", onclick: () => act("Apprentissage", async () => {
        const r = await post("/api/baseline/train");
        return r.result === "auto_activated" ? `Modèle v${r.version} activé : aucun nouveau comportement à valider.` : `Modèle candidat v${r.version} prêt : ${r.hosts} machine(s) à valider ci-dessous.`;
      }), ...(b.candidate ? { disabled: "" } : disabled) }, "Lancer un apprentissage"),
      versions.length ? [versionSel, el("button", { class: "btn", onclick: () => act("Retour arrière", async () => {
        await post("/api/baseline/rollback", { version: Number(versionSel.value) });
        return `Retour au modèle v${versionSel.value}.`;
      }), ...disabled }, "Revenir à cette version")] : null),
    baselineMsg.text ? el("div", { class: `msg${baselineMsg.err ? " err" : ""}` }, baselineMsg.text) : null,
    canWrite ? null : el("div", { class: "msg" }, NO_TOKEN),
    b.candidate ? renderCandidate(b.candidate, act, disabled) : null,
    b.exceptions.length ? el("div", { class: "candidate" }, el("h4", {}, "Exceptions actives (jusqu'au prochain modèle)"),
      el("ul", {}, b.exceptions.map(e => el("li", {}, `${e.host} : ${e.labels.join(", ")}${e.reason ? ` (${e.reason})` : ""}`)))) : null,
    b.decisions.length ? el("div", { class: "candidate" }, el("h4", {}, "Dernières décisions"),
      el("ul", {}, b.decisions.slice(0, 5).map(d => el("li", { class: "meta" }, `${fmtTime(d.at)} · ${d.host ? `${d.host} · ` : ""}${d.detail}${d.reason ? ` (${d.reason})` : ""}`)))) : null,
  ].filter(x => x != null));
}

// Diff du modèle candidat : une carte par machine, à accepter ou refuser, puis validation globale.
function renderCandidate(c, act, disabled) {
  const d = c.diff;
  const table = (rows) => el("table", { class: "changes" },
    el("tr", {}, el("th", {}, "Caractéristique"), el("th", {}, "Avant"), el("th", {}, "Après")),
    rows.map(r => el("tr", {}, el("td", {}, r.feature), el("td", {}, r.before), el("td", {}, r.after))));
  const cards = d.hosts.map(h => {
    const card = el("div", { class: `host-diff${h.drift.length ? " drift" : ""}${choices[h.host] ? ` chosen-${choices[h.host]}` : ""}` },
      el("div", { class: "line" },
        el("strong", {}, h.host),
        h.new_host ? el("span", { class: "badge" }, "nouvelle machine") : null,
        h.drift.length ? el("span", { class: "warn" }, "⚠ dérive cumulée depuis le premier modèle") : null),
      el("p", { class: "meta" }, d.first_model
        ? `Profil appris sur ${fmtNum(h.newly_accepted)} fenêtre(s)${h.first ? ` du ${fmtTime(h.first)} au ${fmtTime(h.last)}` : ""}.`
        : h.newly_accepted ? `${fmtNum(h.newly_accepted)} fenêtre(s) que le modèle actif signalait et que le nouveau accepterait${h.first ? `, du ${fmtTime(h.first)} au ${fmtTime(h.last)}` : ""}.` : "Le profil habituel change."),
      h.changes.length ? table(h.changes) : null,
      h.drift.length ? [el("p", { class: "warn" }, "Dérive :"), table(h.drift)] : null,
      el("div", { class: "line" },
        el("button", { class: `btn ok`, onclick: () => { choices[h.host] = "accept"; lastBaseline = ""; refreshBaseline(); }, ...disabled }, "Accepter"),
        el("button", { class: `btn danger`, onclick: () => { choices[h.host] = "reject"; lastBaseline = ""; refreshBaseline(); }, ...disabled }, "Refuser"),
        choices[h.host] ? el("span", { class: "meta" }, choices[h.host] === "accept" ? "→ accepté" : "→ refusé") : null));
    return card;
  });
  const missing = d.hosts.filter(h => !choices[h.host]).length;
  const setAll = (v) => { d.hosts.forEach(h => { choices[h.host] = v; }); lastBaseline = ""; refreshBaseline(); };
  // Machines peu actives (3 fenêtres au plus, sans changement de profil ni dérive) : repliées pour
  // que l'attention se porte sur les machines qui comptent. Elles restent à décider une par une.
  const minor = (h) => h.newly_accepted <= 3 && !h.changes.length && !h.drift.length;
  const main = cards.filter((_, i) => !minor(d.hosts[i]));
  const small = cards.filter((_, i) => minor(d.hosts[i]));
  return el("div", { class: "candidate" },
    el("h4", {}, `Modèle candidat v${c.model.version} à valider`),
    el("p", {}, d.first_model
      ? "Premier modèle : vérifiez que le profil appris de chaque machine correspond bien à son usage normal."
      : "Le nouveau modèle accepterait les comportements suivants. Rien n'est accepté sans votre accord ; une machine refusée verra ces fenêtres marquées suspectes."),
    el("div", { class: "line" },
      el("button", { class: "btn", onclick: () => setAll("accept"), ...disabled }, "Tout accepter"),
      el("button", { class: "btn", onclick: () => setAll("reject"), ...disabled }, "Tout refuser")),
    main,
    small.length ? el("details", {},
      el("summary", { class: "meta" }, `${small.length} machine(s) peu active(s) : 3 fenêtres au plus, sans changement de profil`),
      small) : null,
    el("div", { class: "line" },
      el("button", { class: "btn primary", onclick: () => act("Validation", async () => {
        const accepted = d.hosts.filter(h => choices[h.host] === "accept").map(h => h.host);
        const rejected = d.hosts.filter(h => choices[h.host] === "reject").map(h => h.host);
        const r = await post("/api/baseline/decision", { accepted, rejected });
        d.hosts.forEach(h => delete choices[h.host]);
        return r.activated ? `Modèle v${r.activated} activé.${r.rejected.length ? ` ${r.rejected.length} machine(s) refusée(s).` : ""}` : "Pas assez de données après les refus : aucun modèle activé.";
      }), ...(missing ? { disabled: "" } : disabled) }, "Valider ma décision"),
      missing ? el("span", { class: "meta" }, `${missing} machine(s) sans décision`) : null));
}

// Relit l'état de l'apprentissage ; ne redessine que s'il a changé (préserve les saisies en cours).
async function refreshBaseline() {
  try {
    const b = await (await fetch(q("/api/baseline"))).json();
    const key = JSON.stringify(b) + JSON.stringify(choices) + baselineMsg.text;
    if (key === lastBaseline) return;
    lastBaseline = key;
    renderBaseline(b);
  } catch { /* l'indicateur de connexion suffit */ }
}

// Démarrage : écouteurs des filtres, premier rendu (liste vide), connexion, statistiques.
for (const id of ["search", "source", "verdict"]) document.getElementById(id).addEventListener("input", renderAll);
renderAll();
connect();
refreshStats();
setInterval(refreshStats, 2000);
refreshBaseline();
setInterval(refreshBaseline, 5000);
</script>
</body>
